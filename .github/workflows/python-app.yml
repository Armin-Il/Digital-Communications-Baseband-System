"""
Basic sanity tests for phase2.py (digital modulation / carrier recovery pipeline).

These are lightweight smoke tests, not exhaustive unit tests: they check that
each modulation scheme round-trips correctly through an ideal (noiseless)
channel, and that a couple of core helper functions behave as expected.
"""

import numpy as np
import pytest

from phase2 import (
    q_function,
    bits_per_symbol,
    modulate,
    demodulate,
    get_constellation,
    theoretical_ber,
)

SCHEMES = ["bpsk", "qpsk", "16qam", "64qam", "64qam_gray"]


@pytest.mark.parametrize("scheme", SCHEMES)
def test_modulate_demodulate_roundtrip_noiseless(scheme):
    """With no channel impairments, demodulating what we modulated should
    recover the original bits exactly."""
    rng = np.random.default_rng(0)
    k = bits_per_symbol(scheme)
    n_symbols = 200
    bits_tx = rng.integers(0, 2, n_symbols * k).astype(np.uint8)

    symbols, _ = modulate(bits_tx, scheme)
    bits_rx = demodulate(symbols, scheme)

    assert len(bits_rx) == len(bits_tx)
    assert np.array_equal(bits_tx, bits_rx)


@pytest.mark.parametrize("scheme", SCHEMES)
def test_constellation_is_unit_energy(scheme):
    """Constellation points should be normalized to unit average energy,
    except BPSK/QPSK which are unit-magnitude by construction."""
    const = get_constellation(scheme)
    pts = np.array(list(const.values()))
    avg_energy = np.mean(np.abs(pts) ** 2)
    assert avg_energy == pytest.approx(1.0, abs=1e-6)


def test_bits_per_symbol_known_schemes():
    assert bits_per_symbol("bpsk") == 1
    assert bits_per_symbol("qpsk") == 2
    assert bits_per_symbol("16qam") == 4
    assert bits_per_symbol("64qam") == 6
    assert bits_per_symbol("64qam_gray") == 6


def test_bits_per_symbol_unknown_scheme_raises():
    with pytest.raises(KeyError):
        bits_per_symbol("unknown_scheme")


def test_q_function_bounds():
    # Q(0) = 0.5, Q(x) is decreasing and stays within [0, 1]
    assert q_function(0.0) == pytest.approx(0.5, abs=1e-9)
    assert 0.0 <= q_function(3.0) <= 0.5
    assert q_function(10.0) < q_function(1.0)


@pytest.mark.parametrize("scheme", ["bpsk", "qpsk", "16qam", "64qam", "64qam_gray"])
def test_theoretical_ber_decreases_with_snr(scheme):
    """BER should monotonically decrease as SNR increases."""
    snr_list = [0, 5, 10, 15, 20]
    ber = theoretical_ber(scheme, snr_list)
    assert np.all(np.diff(ber) <= 0)
    assert np.all(ber >= 0.0) and np.all(ber <= 1.0)


def test_modulate_unknown_scheme_raises():
    with pytest.raises(ValueError):
        modulate(np.array([0, 1, 0, 1], dtype=np.uint8), "not_a_scheme")
        pytest
